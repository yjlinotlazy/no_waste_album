<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>No Waste Album POC</title><link rel="stylesheet" href="/styles.css?v=20260917-2">
</head>
<body>
  <header class="topbar"><div><span class="eyebrow">LOCAL ALBUM STUDIO</span><h1>No Waste Album</h1></div><div class="toolbar"><button id="advancedJobsGlobal">高级任务</button><button id="settingsBtn">设置</button><button id="rescanBtn" title="Full rescan of the configured library">Re-scan</button><button id="modeBtn" class="mode operator">牛马模式</button><span id="status">Loading library…</span></div></header>
  <main class="layout"><aside class="sidebar"><div class="section-title">FOLDERS</div><div id="folders"></div></aside><section class="content"><div class="content-head"><div><span class="eyebrow">LIBRARY</span><h2 id="folderTitle">Library</h2><div id="resultCount" class="subtle"></div></div><div class="library-tools"><input id="search" type="search" placeholder="Search images…"><select id="tagFilter" aria-label="Filter by tag"><option value="">所有标签</option></select><label>Per page <select id="pageSize"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="50">50</option></select></label></div></div><div id="grid" class="grid"></div><nav id="pagination" class="pagination"></nav></section></main>
  <section id="jobsView" class="jobs-view hidden"><div class="jobs-head"><div><span class="eyebrow">ML MODEL STUDIO</span><h2>高级任务 · ML模型</h2><div class="subtle">管理个人相册质量模型、评分任务和反馈</div></div><button id="backToLibrary">返回图库</button></div><div class="jobs-layout"><aside class="jobs-list-panel"><div class="section-title">JOB HISTORY</div><div id="jobsList"></div></aside><section class="job-detail"><section class="model-type-section"><div class="section-title">训练模型类型</div><div class="model-type-list"><button id="trainPersonalModel" class="model-type-card" type="button" disabled><strong>个人相册质量模型</strong><span>使用你的高质量标签和错误预测反馈训练</span></button></div></section><section class="model-type-section"><div class="section-title">评估模型类型</div><div class="model-type-list"><button id="runAlbumQualityJob" class="model-type-card" type="button" disabled title="请先训练个人相册质量模型"><strong>个人相册质量检测</strong><span>对照片进行相册价值评分并提供反馈</span></button><button id="runQualityJob" class="model-type-card" type="button"><strong>技术质量检测</strong><span>检测模糊、曝光和分辨率等技术问题</span></button></div></section><section class="model-type-section"><div class="section-title">图像处理类型</div><div class="model-type-list"><button id="runAutoJob" class="model-type-card" type="button"><strong>Auto Develop</strong><span>生成自动修图 variant</span></button></div></section><div class="job-run-card"><label>处理范围<input id="jobFolder" type="text" placeholder="例如：2024/旅行"></label><div class="actions"><button id="cancelQualityJob" type="button" disabled>取消任务</button></div><p id="qualityJobStatus" class="subtle">选择一个模型或处理类型，或从左侧选择已有 job。</p></div><div id="jobResultsPanel" class="hidden"><div class="job-results-head"><h3 id="jobResultsTitle">结果</h3><div class="retag-controls"><label>Tag threshold <input id="retagThreshold" type="number" min="0" max="1" step="0.01" value="0.55"></label><label><input id="badOnlyFilter" type="checkbox"> 只看 bad quality</label><button id="retagQualityTags" class="primary">重新应用 bad_quality tag</button><button id="deleteAutoVariants">删除本次 auto variants</button></div></div><div id="jobResults"></div><nav id="jobResultsPagination" class="pagination"></nav></div></section></div></section>
  <div id="editor" class="modal hidden"><div class="editor-card"><div class="editor-head"><div><span class="eyebrow">PHOTO VIEW</span><h2 id="editorTitle"></h2></div><button id="closeEditor" class="icon">×</button></div><div class="editor-body"><div class="viewport"><div class="canvas-tools"><button id="handTool" class="tool active" title="Pan image" aria-label="Pan image">✋</button><button id="zoomTool" class="tool" title="Zoom image" aria-label="Zoom image">🔍</button><button id="zoomOut" class="tool" title="Zoom out" aria-label="Zoom out">−</button><span id="zoomLabel">100%</span><button id="zoomIn" class="tool" title="Zoom in" aria-label="Zoom in">＋</button><button id="zoomReset" class="tool" title="Reset view" aria-label="Reset view">Reset</button></div><div class="canvas-wrap"><canvas id="canvas"></canvas></div></div><aside class="controls"><label>Crop X <input data-key="crop.x" type="range" min="0" max="0.5" step="0.01" value="0"><output></output></label><label>Crop Y <input data-key="crop.y" type="range" min="0" max="0.5" step="0.01" value="0"><output></output></label><label>Crop width <input data-key="crop.width" type="range" min="0.5" max="1" step="0.01" value="1"><output></output></label><label>Crop height <input data-key="crop.height" type="range" min="0.5" max="1" step="0.01" value="1"><output></output></label><label>Brightness <input data-key="adjustments.brightness" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>Contrast <input data-key="adjustments.contrast" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>Saturation <input data-key="adjustments.saturation" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>White balance <input data-key="adjustments.temperature" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>Filter <select id="filter"><option value="none">None</option><option value="warm">Warm</option><option value="mono">Monochrome</option></select></label><div class="actions"><button id="saveVariant" class="primary">新建 variant</button><button id="overwriteVariant" type="button">覆盖当前 variant</button><button id="editorHide">隐藏</button><button id="editorDelete" class="danger">删除</button></div><div id="variants"></div></aside></div></div></div>
  <div id="settings" class="modal hidden"><div class="settings-card"><div class="editor-head"><div><span class="eyebrow">APP SETTINGS</span><h2>设置</h2></div><button id="closeSettings" class="icon">×</button></div><form id="settingsForm" class="settings-form"><label>图库文件夹<input id="settingsLibrary" type="text" required></label><label>每页图片数量<select id="settingsPageSize"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="50">50</option></select></label><div class="actions"><button type="submit" class="primary">保存设置</button><button type="button" id="cancelSettings">取消</button></div><p id="settingsStatus" class="subtle"></p></form></div></div>
  <script src="/app.js?v=20260917-3"></script>
</body>
</html>
