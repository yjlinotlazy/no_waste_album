<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>No Waste Album POC</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><div><span class="eyebrow">LOCAL ALBUM STUDIO</span><h1>No Waste Album</h1></div><div class="toolbar"><button id="modeBtn" class="mode operator">牛马模式</button><span id="status">Loading library…</span></div></header>
  <main class="layout"><aside class="sidebar"><div class="section-title">FOLDERS</div><div id="folders"></div></aside><section class="content"><div class="content-head"><div><span class="eyebrow">LIBRARY</span><h2 id="folderTitle">Library</h2><div id="resultCount" class="subtle"></div></div><input id="search" type="search" placeholder="Search images…"></div><div id="grid" class="grid"></div><nav id="pagination" class="pagination"></nav></section></main>
  <div id="editor" class="modal hidden"><div class="editor-card"><div class="editor-head"><div><span class="eyebrow">PHOTO VIEW</span><h2 id="editorTitle"></h2></div><button id="closeEditor" class="icon">×</button></div><div class="editor-body"><div class="viewport"><div class="canvas-tools"><button id="handTool" class="tool active" title="Pan image" aria-label="Pan image">✋</button><button id="zoomTool" class="tool" title="Zoom image" aria-label="Zoom image">🔍</button><button id="zoomOut" class="tool" title="Zoom out" aria-label="Zoom out">−</button><span id="zoomLabel">100%</span><button id="zoomIn" class="tool" title="Zoom in" aria-label="Zoom in">＋</button><button id="zoomReset" class="tool" title="Reset view" aria-label="Reset view">Reset</button></div><div class="canvas-wrap"><canvas id="canvas"></canvas></div></div><aside class="controls"><label>Crop X <input data-key="crop.x" type="range" min="0" max="0.5" step="0.01" value="0"><output></output></label><label>Crop Y <input data-key="crop.y" type="range" min="0" max="0.5" step="0.01" value="0"><output></output></label><label>Crop width <input data-key="crop.width" type="range" min="0.5" max="1" step="0.01" value="1"><output></output></label><label>Crop height <input data-key="crop.height" type="range" min="0.5" max="1" step="0.01" value="1"><output></output></label><label>Brightness <input data-key="adjustments.brightness" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>Contrast <input data-key="adjustments.contrast" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>Saturation <input data-key="adjustments.saturation" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>White balance <input data-key="adjustments.temperature" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label><label>Filter <select id="filter"><option value="none">None</option><option value="warm">Warm</option><option value="mono">Monochrome</option></select></label><div class="actions"><button id="saveVariant" class="primary">Save variant</button><button id="exportVariant">Export JPEG</button></div><div id="variants"></div></aside></div></div></div>
  <script src="/app.js"></script>
</body>
</html>
